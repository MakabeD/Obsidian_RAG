services:
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chromadb
    restart: unless-stopped

    ports:
      - "127.0.0.1:p:8000"

    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

    volumes:
      - ./data:/chroma/chroma

    networks:
      - chroma-net

networks:
  chroma-net: