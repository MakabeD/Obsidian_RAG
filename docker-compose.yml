services:
  api:
    build: .
    container_name: obsidian-rag-api
    restart: unless-stopped

    environment:
      - Rag__ChromaBaseUrl=http://chromadb:8000

    ports:
      - "127.0.0.1:5011:8080"

    depends_on:
      chromadb:
        condition: service_healthy

  chromadb:
    # Same digest pin as chromadb/docker-compose.yml (keep both files in sync)
    image: ghcr.io/chroma-core/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    container_name: chromadb
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

    volumes:
      - ./chromadb/data:/chroma/chroma

    # The chroma image ships no curl/wget/python, so the probe uses bash's /dev/tcp
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\r\n\r\n' >&3; head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
